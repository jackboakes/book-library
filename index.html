<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library of Books</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Library of Books</h1>
        <nav>
            <ul>
                <li>
                    <button command="show-modal" commandfor="hello-world" class="new-book">Add New Book</button>
                </li>
            </ul>
        </nav>
    </header>
    <div class="container-titles">
        <h2>Title</h2>
        <h2>Author</h2>
        <h2>Pages</h2>
        <h2>Shelve</h2>
        <div class="book-container">
        </div>
    </div>
    <dialog id="hello-world">
        <form id="add-book-form">
            <header class="button-container">
                <h1>Add New Book</h1>
                <button id="close-modal">✕</button>
            </header>
            <div class="form-row">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" required />
            </div>
            <div class="form-row">
                <label for="author">Author *</label>
                <input type="text" id="author" name="author" required />
            </div>
            <div class="form-row">
                <label for="pages">Pages *</label>
                <input type="number" id="pages" name="pages" min="1" max="20000" required />
            </div>
            <div class="form-row">
                <input type="checkbox" id="read" name="read" />
                <label for="read">Read</label>
            </div>
            <button type="submit">Submit</button>
        </form>
       
    </dialog>
</body>
</html>
